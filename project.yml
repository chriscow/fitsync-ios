name: FitSync
options:
  bundleIdPrefix: com.chriscow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3ATK7G5LP4
    CODE_SIGN_STYLE: Automatic
targets:
  FitSync:
    type: application
    platform: iOS
    sources:
      - FitSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chriscow.fitsync
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: FitSync/FitSync.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: FitSync/FitSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: FitSync/Info.plist
      properties:
        CFBundleDisplayName: FitSync
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: FitSync reads your workouts to check for duplicates before importing.
        NSHealthUpdateUsageDescription: FitSync saves imported .fit activities, including GPS routes and heart rate, to Apple Health.
        # Copy files in rather than editing them in place.
        LSSupportsOpeningDocumentsInPlace: false
        # Declare the .fit type so iOS maps the extension to it.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT Activity File
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit, FIT]
              public.mime-type: [application/vnd.ant.fit, application/fit]
        # Register as a handler so FitSync shows up in share sheets / "Open in…".
        CFBundleDocumentTypes:
          - CFBundleTypeName: FIT Activity File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.garmin.fit]
